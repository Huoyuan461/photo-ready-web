name: Delivery QA Comment

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number for the order entering QA or delivery"
        required: true
      delivery_note:
        description: "Optional delivery note or export summary"
        required: false

permissions:
  issues: write

jobs:
  post-delivery-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Post QA and delivery checklist
        uses: actions/github-script@v8
        with:
          script: |
            const issue_number = Number(core.getInput("issue_number"));
            const deliveryNote = core.getInput("delivery_note");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                "### QA and delivery checklist",
                "",
                "- Confirm the produced asset or entitlement matches the purchased SKU.",
                "- Move the item to `Stage: QA` while customer success reviews edge cases.",
                "- After approval, move the item to `Stage: Delivered`.",
                "- Send the support link and confirm the customer can access the output.",
                "- If the order is stable, trigger the retention follow-up flow.",
                "",
                deliveryNote
                  ? `Delivery note: ${deliveryNote}`
                  : "Delivery note: not provided",
              ].join("\\n"),
            });
