<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MealMind Support</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin: 0; background: #fff7f2; color: #2d3436; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px 72px; }
    .hero { background: linear-gradient(180deg,#ff6b4a,#ffe4dc); color: white; padding: 28px; border-radius: 28px; box-shadow: 0 16px 40px rgba(255,107,74,.18); }
    h1 { margin: 0 0 8px; font-size: 40px; }
    h2 { margin-top: 24px; }
    p, li { line-height: 1.7; }
    .card { background: rgba(255,255,255,.72); border: 1px solid rgba(45,52,54,.08); border-radius: 22px; padding: 20px 22px; margin-top: 18px; }
    a { color: #ff6b4a; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>MealMind</h1>
      <p>本地优先的每日三选一餐饮推荐。</p>
      <p>如果导入的截图或文本识别不准确，你可以直接修正，不会丢失整批记录。</p>
    </section>
    <section class="card">
      <h2>Common fixes</h2>
      <ul>
        <li>使用手动补录记录商家、餐品、价格、预计送达时间和时段。</li>
        <li>把外卖 App 的纯文本订单复制后粘贴进 MealMind。</li>
        <li>从其他 App 分享截图、链接或文本到 MealMind。</li>
        <li>先查看待确认导入，再保存到本地历史。</li>
      </ul>
    </section>
    <section class="card">
      <h2>What MealMind does not do</h2>
      <p>MealMind 不会登录第三方外卖账号，也不会自动下单。</p>
    </section>
    <section class="card">
      <h2>Contact</h2>
      <p>huoyuan461@qq.com</p>
    </section>
  </main>
</body>
</html>
