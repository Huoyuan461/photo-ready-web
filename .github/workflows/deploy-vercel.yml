name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_COMPANY_LEGAL_NAME: ${{ secrets.NEXT_PUBLIC_COMPANY_LEGAL_NAME }}
          LEMON_SQUEEZY_CHECKOUT_URL: ${{ secrets.LEMON_SQUEEZY_CHECKOUT_URL }}
          LEMON_SQUEEZY_SUBSCRIPTION_URL: ${{ secrets.LEMON_SQUEEZY_SUBSCRIPTION_URL }}
          LEMON_SQUEEZY_PFMEA_PACK_URL: ${{ secrets.LEMON_SQUEEZY_PFMEA_PACK_URL }}
          LEMON_SQUEEZY_LEAN_KIT_URL: ${{ secrets.LEMON_SQUEEZY_LEAN_KIT_URL }}
          LEMON_SQUEEZY_OFFICE_CHECKLISTS_URL: ${{ secrets.LEMON_SQUEEZY_OFFICE_CHECKLISTS_URL }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          OPENAI_IMAGE_TIMEOUT_MS: ${{ secrets.OPENAI_IMAGE_TIMEOUT_MS }}
          ID_ENGINE_URL: ${{ secrets.ID_ENGINE_URL }}
          DATA_DIR: ${{ secrets.DATA_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ secrets.GITHUB_REPO_OWNER }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
          GITHUB_AUTO_SYNC_ORDERS: ${{ secrets.GITHUB_AUTO_SYNC_ORDERS }}
          GITHUB_PROJECT_ID: ${{ secrets.GITHUB_PROJECT_ID }}
          GITHUB_PROJECT_STAGE_FIELD_ID: ${{ secrets.GITHUB_PROJECT_STAGE_FIELD_ID }}
          GITHUB_PROJECT_DEPARTMENT_FIELD_ID: ${{ secrets.GITHUB_PROJECT_DEPARTMENT_FIELD_ID }}
          GITHUB_PROJECT_REVENUE_FIELD_ID: ${{ secrets.GITHUB_PROJECT_REVENUE_FIELD_ID }}
          GITHUB_PROJECT_STAGE_OPTIONS_JSON: ${{ secrets.GITHUB_PROJECT_STAGE_OPTIONS_JSON }}
          GITHUB_PROJECT_DEPARTMENT_OPTIONS_JSON: ${{ secrets.GITHUB_PROJECT_DEPARTMENT_OPTIONS_JSON }}
          GITHUB_PROJECT_REVENUE_OPTIONS_JSON: ${{ secrets.GITHUB_PROJECT_REVENUE_OPTIONS_JSON }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
